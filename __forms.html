<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Netlify Forms</title>
  </head>
  <body>
    <form name="contact" method="POST" action="/__forms.html" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact">
      <input type="hidden" name="subject" value="[fxnholdings.com] Contact form">
      <input type="text" name="name">
      <input type="email" name="email">
      <input type="text" name="company">
      <input type="text" name="reason">
      <textarea name="message"></textarea>
      <input name="bot-field">
    </form>
    <form name="chat-enquiry" method="POST" action="/__forms.html" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="chat-enquiry">
      <input type="hidden" name="subject" value="[fxnholdings.com] Enquiry from the website assistant">
      <input type="text" name="name">
      <input type="email" name="email">
      <input type="text" name="company">
      <input type="text" name="enquiry_type">
      <textarea name="summary"></textarea>
      <textarea name="transcript"></textarea>
      <input name="bot-field">
    </form>
  </body>
</html>
